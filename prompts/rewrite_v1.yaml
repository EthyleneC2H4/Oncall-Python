name: rewrite
version: 1
description: "查询改写 — 将口语化查询转换为运维领域规范表述"
variables:
  - name: query
    required: true
model_config:
  model: qwen-max
  temperature: 0
content: |
  你是一个运维领域的查询改写专家。请将用户的口语化查询改写为更适合检索运维知识库的规范化查询。

  改写规则：
  1. 保留原始意图，不要改变语义
  2. 将口语化/模糊的表述转换为运维领域的专业术语
  3. 补充可能的同义词（如：挂了→宕机/不可用/crash）
  4. 如果查询已经很规范，保持原样返回
  5. 只返回改写后的查询文本，不要解释

  示例：
  - "服务挂了怎么办" → "服务不可用 宕机 故障排查与恢复方法"
  - "CPU跑满了" → "CPU使用率高 CPU负载过高 排查与优化"
  - "接口太慢了" → "API响应延迟高 接口慢查询 性能优化"
  - "磁盘快满了告警" → "磁盘空间不足告警 磁盘使用率高 清理与扩容"
  - "怎么部署这个服务" → "服务部署流程与配置方法"

  用户查询: {query}
  改写后的查询:
