<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能OnCall助手</title>
    <link rel="stylesheet" href="/static/styles.css">
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- HTML 净化（本地化，不依赖 CDN）：marked 输出一律过 DOMPurify 再 innerHTML，
         阻断经知识库/图谱内容投毒的存储型 XSS -->
    <script src="/static/vendor/dompurify.min.js"></script>
    <!-- 代码高亮库（可选） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
    <!-- 知识图谱可视化 -->
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">智能OnCall助手</h2>
            </div>
            
            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>新建对话</span>
                </button>
                
                <div class="chat-history-section">
                    <div class="history-header">
                        <span>近期对话</span>
                    </div>
                    <div class="chat-history-list" id="chatHistoryList">
                        <!-- 历史对话列表将在这里动态生成 -->
                    </div>
                </div>
                
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <button class="kg-top-btn" id="approvalsBtn" title="待审批动作">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3L4.5 6V11C4.5 15.9 7.6 20.1 12 21C16.4 20.1 19.5 15.9 19.5 11V6L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>审批</span>
                <span class="approvals-badge" id="approvalsBadge" style="display:none;">0</span>
            </button>
            <button class="kg-top-btn" id="kgSidebarBtn" title="知识图谱">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="5" r="3" stroke="currentColor" stroke-width="2"/>
                    <circle cx="5" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
                    <circle cx="19" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 8V12M8.5 17L10.5 14M15.5 17L13.5 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>知识图谱</span>
            </button>
            <button class="ai-ops-top-btn" id="aiOpsSidebarBtn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>AI Ops</span>
            </button>
            <div class="chat-container">
                <div class="welcome-greeting" id="welcomeGreeting">
                    <p>你好！我是智能Oncall小助手</p>
                </div>
                <div class="chat-messages" id="chatMessages">
                </div>
                
                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper">
                            <input type="text" id="messageInput" placeholder="问问智能OnCall助手" maxlength="1000" class="message-input">
                            <div class="input-bottom-bar">
                                <div class="tools-btn-wrapper">
                                    <button class="tools-btn" id="toolsBtn" title="更多选项">
                                        <svg class="tools-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
                                        </svg>
                                    </button>
                                    <div class="tools-menu" id="toolsMenu">
                                        <div class="tools-menu-item" id="uploadFileItem">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <span>上传文件</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="right-actions">
                                    <div class="mode-selector-wrapper">
                                        <button class="mode-selector-btn" id="modeSelectorBtn">
                                            <span id="currentModeText">快速</span>
                                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                        <div class="mode-dropdown" id="modeDropdown">
                                            <div class="dropdown-header">选择对话方式</div>
                                            <div class="dropdown-item active" data-mode="quick">
                                                <div class="dropdown-item-main">
                                                    <span>快速</span>
                                                    <span class="badge-new">新</span>
                                                </div>
                                                <div class="dropdown-item-sub">快速对话</div>
                                            </div>
                                            <div class="dropdown-item" data-mode="stream">
                                                <div class="dropdown-item-main">
                                                    <span>流式</span>
                                                </div>
                                                <div class="dropdown-item-sub">流式对话</div>
                                            </div>
                                        </div>
                                    </div>
                                    <button class="send-btn-circle" id="sendButton" title="发送">
                                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown" style="display: none;">
                </div>
            </div>
        </main>
    </div>

    <!-- 加载遮罩层 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">智能运维分析中，请稍候...</div>
            <div class="loading-subtext">后端正在处理，请耐心等待</div>
        </div>
    </div>

    <!-- 知识图谱弹窗 -->
    <div id="kgModal" class="kg-modal" style="display:none;">
        <div class="kg-modal-content">
            <div class="kg-modal-header">
                <h3>运维知识图谱</h3>
                <div class="kg-modal-controls">
                    <select id="kgAlertFilter" class="kg-filter-select">
                        <option value="">全部节点</option>
                        <option value="HighCPUUsage">CPU 告警</option>
                        <option value="HighMemoryUsage">内存告警</option>
                        <option value="HighDiskUsage">磁盘告警</option>
                        <option value="SlowResponse">响应慢</option>
                        <option value="ServiceUnavailable">服务不可用</option>
                    </select>
                    <button class="kg-close-btn" id="kgCloseBtn">&times;</button>
                </div>
            </div>
            <div class="kg-modal-body">
                <div id="kgGraph" style="width:100%;height:500px;border:1px solid #e0e0e0;border-radius:8px;"></div>
                <div id="kgAnalysis" class="kg-analysis-panel"></div>
            </div>
            <div class="kg-legend">
                <span><i style="background:#e74c3c"></i> 告警</span>
                <span><i style="background:#f39c12"></i> 根因</span>
                <span><i style="background:#27ae60"></i> 处置动作</span>
                <span><i style="background:#3498db"></i> 工具</span>
                <span style="margin-left:16px;">—— 因果/处置</span>
                <span>- - - 级联/使用</span>
            </div>
        </div>
    </div>

    <!-- 高风险动作审批面板（C1）：复用 kg-modal 样式族 -->
    <div id="approvalsModal" class="kg-modal" style="display:none;">
        <div class="kg-modal-content approvals-modal-content">
            <div class="kg-modal-header">
                <h3>高风险动作审批</h3>
                <div class="kg-modal-controls">
                    <button class="kg-close-btn" id="approvalsCloseBtn">&times;</button>
                </div>
            </div>
            <div class="kg-modal-body">
                <p class="approvals-hint">
                    以下动作由 Agent 发起、因风险等级被拦截，需人工裁决。
                    超时未裁决的动作将自动失效（TTL 倒计时见各卡片）。
                </p>
                <div id="pendingActionsList" class="pending-actions-list"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
