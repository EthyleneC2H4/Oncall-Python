name: CI - OnCall Agent 质量门禁

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: '评测模式'
        required: true
        default: 'regression'
        type: choice
        options:
          - smoke
          - gating
          - regression
          - full
      suite:
        description: 'P4 套件（与 mode 二选一；judge 调用 LLM 花钱，仅手动触发）'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - bfcl
          - gaia
          - judge

jobs:
  # ──────────────── Lint & Format ────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check app/
      - name: ruff format check
        run: uv run ruff format --check app/
      - name: mypy check
        run: uv run mypy app/ --ignore-missing-imports

  # ──────────────── Unit Tests ────────────────
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync --extra dev
      # 测试失败必须让作业红：此前 exit code 被 || echo 吞掉，
      # 失败的 pytest 也显示绿色（门禁形同虚设）
      - name: Run unit tests
        run: |
          uv run pytest tests/ \
            -v --tb=short --cov=app --cov-report=term-missing --cov-report=html \
            --timeout=120
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ──────────────── AI Eval Gating ────────────────
  eval-gating:
    name: AI Eval Gate (RAGAS + Component)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'pull_request'
    # 托管 runner 无 Milvus/BGE 全栈，评测走降级档，指标仅作参考不阻塞；
    # CLI 门禁语义已真实化（未过即非零退出），失败在此显示为预期失败，
    # 真正的质量门禁在本地全栈或自托管 runner 上执行
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync
      - name: Run AI evaluation gating
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python -m app.eval.ci_runner --mode gating --threshold 0.6
      - name: Publish report to step summary
        if: always()
        run: cat eval/results/ci_gating_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/results/ci_gating_*.json

  # ──────────────── Regression (on push to main) ────────────────
  eval-regression:
    name: Full Regression Eval
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 托管 runner 无 Milvus/BGE 全栈，评测走降级档，指标仅作参考不阻塞；
    # CLI 门禁语义已真实化（未过即非零退出），失败在此显示为预期失败，
    # 真正的质量门禁在本地全栈或自托管 runner 上执行
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync
      - name: Run full regression
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python -m app.eval.ci_runner --mode regression
      - name: Publish report to step summary
        if: always()
        run: cat eval/results/ci_regression_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: eval/results/ci_regression_*.json

  # ──────────────── Manual: Full E2E ────────────────
  eval-full:
    name: Full E2E RAGAS Eval (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync
      - name: Run full E2E evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python -m app.eval.ci_runner --mode full --max-e2e 10

  # ──────────────── Offline Suites (PR/push 免费) ────────────────
  # bfcl 回放工具痕迹、gaia 给端到端答案定级——无数据时优雅跳过（跳过≠失败）
  eval-offline-suites:
    name: Offline Suites (BFCL + GAIA)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync
      - name: BFCL 工具调用评测（离线回放）
        run: uv run python -m app.eval.ci_runner --suite bfcl
      - name: GAIA 任务分级评测（离线定级）
        run: uv run python -m app.eval.ci_runner --suite gaia
      - name: Upload suite reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-reports
          path: eval/results/ci_bfcl_*.json
          if-no-files-found: ignore

  # ──────────────── Manual: Judge Pairwise（花钱套件） ────────────────
  eval-judge:
    name: LLM Judge Pairwise (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'judge'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync
      - name: Run judge pairwise win-rate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python -m app.eval.ci_runner --suite judge
      - name: Upload judge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-report
          path: eval/results/ci_judge_*.json
      - name: Upload full eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-report
          path: eval/results/ci_full_*.json

  # ──────────────── Result Summary ────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, eval-gating, eval-regression, eval-offline-suites]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## OnCall CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| eval-gating | ${{ needs.eval-gating.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| eval-regression | ${{ needs.eval-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| offline-suites | ${{ needs.eval-offline-suites.result }} |" >> $GITHUB_STEP_SUMMARY
